[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocount-assist"
version = "0.1.0"
description = "Read-only support assistant for AutoCount Accounting 2.2 desktop"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "pyodbc>=5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autocount-assist = "autocount_assist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocount_assist = ["playbooks/*.yaml", "knowledge/*.yaml", "samples/*.yaml", "compat.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
