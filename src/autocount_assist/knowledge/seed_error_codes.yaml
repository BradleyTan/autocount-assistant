# Seed error codes loaded into a new knowledge base. `pattern` is matched against your
# question and recent log errors. Add AutoCount-specific codes with
# `autocount-assist learn error-code` as you meet them.
- code: "SQL 18456"
  source: SQL Server
  pattern: '\b18456\b|login failed for user'
  message: Login failed for user
  cause: Wrong SQL login or password, login disabled or locked, or SQL authentication not enabled on the instance.
  fix: Check the login in SQL Server Management Studio > Security > Logins, and that the instance allows SQL Server and Windows Authentication mode.
- code: "SQL 18452"
  source: SQL Server
  pattern: '\b18452\b|untrusted domain'
  message: Login failed. The login is from an untrusted domain and cannot be used with Integrated authentication
  cause: Windows authentication was used from a PC or account the server does not trust (workgroup PC, different domain).
  fix: Use a SQL login instead, or log in to Windows with an account the SQL Server machine trusts.
- code: "SQL 4060"
  source: SQL Server
  pattern: '\b4060\b|cannot open database .{0,80}requested by the login'
  message: Cannot open database requested by the login
  cause: The account book database is offline, renamed, or the login has no user mapped in that database.
  fix: Confirm the database is ONLINE and the login is mapped to it (User Mapping).
- code: "SQL 229"
  source: SQL Server
  pattern: 'permission was denied on the object'
  message: The SELECT/EXECUTE permission was denied on the object
  cause: The login lacks permission on that object (expected for the read-only login on anything but SELECT).
  fix: For AutoCount users, check AutoCount's own SQL login is intact; do not grant extra rights to ac_readonly.
- code: "SQL 1205"
  source: SQL Server
  pattern: '\b1205\b.{0,40}deadlock|deadlock victim|was deadlocked'
  message: Transaction was deadlocked
  cause: Two sessions locked the same rows, often heavy posting while a report or costing recalculation runs.
  fix: Retry the action; schedule recalculations and large reports outside busy hours.
- code: "SQL 9002"
  source: SQL Server
  pattern: 'transaction log for database .{0,80}is full|(?:error|msg)\D{0,12}9002\b'
  message: The transaction log for database is full
  cause: Log file cannot grow (disk full or max size reached) or log backups are not running in FULL recovery.
  fix: Free disk space, take a log backup or switch to SIMPLE recovery after a full backup.
- code: "SQL 1105"
  source: SQL Server
  pattern: 'could not allocate space for object|(?:error|msg)\D{0,12}1105\b'
  message: Could not allocate space for object because the filegroup is full
  cause: The data file cannot grow. The disk is full, the file has a size cap, or SQL Server Express reached its 10 GB limit per database.
  fix: Check free disk space and the SQL Server edition (`autocount-assist scan`). For Express at the limit, archive old data or move to a paid edition.
- code: "SQL 1827"
  source: SQL Server
  pattern: 'exceed your licensed limit|(?:error|msg)\D{0,12}1827\b'
  message: Database size would exceed your licensed limit of 10240 MB per database
  cause: SQL Server Express limits each database to 10 GB of data.
  fix: Archive or purge old data (after a backup), or upgrade to SQL Server Standard.
- code: "SQL -2 / Timeout expired"
  source: SQL Server client
  pattern: 'timeout expired|execution timeout'
  message: Timeout expired. The timeout period elapsed prior to completion of the operation
  cause: Long-running query, blocking, or very slow disk/network.
  fix: Check blocking sessions (Activity Monitor) and index maintenance; retry outside busy hours.
- code: "SQL network error 26"
  source: SQL Server client
  pattern: 'error locating server/instance|error:? ?26\b.{0,40}locating'
  message: Error Locating Server/Instance Specified
  cause: Named instance (e.g. A2006) not reachable because SQL Server Browser stopped, firewall blocking UDP 1434, or wrong instance name.
  fix: Start SQL Server Browser service, allow UDP 1434 and the instance port in the firewall, verify the instance name.
- code: "SQL network error 40"
  source: SQL Server client
  pattern: 'could not open a connection to sql server|server was not found or was not accessible'
  message: Could not open a connection to SQL Server
  cause: The SQL Server service is stopped, the server name is wrong, or the firewall blocks the port.
  fix: Start the SQL Server service, check the server name, and allow the instance through the firewall.
- code: "SQL 233"
  source: SQL Server client
  pattern: 'no process is on the other end of the pipe'
  message: No process is on the other end of the pipe
  cause: The server accepted the connection but refused the login, often because SQL authentication is turned off.
  fix: Turn on SQL Server and Windows Authentication mode, then restart the SQL Server service.
- code: "SQL 3169"
  source: SQL Server
  pattern: 'backed up on a server running version|(?:error|msg)\D{0,12}3169\b'
  message: The database was backed up on a server running a newer version
  cause: The backup comes from a newer SQL Server than the one restoring it. SQL Server cannot restore to an older version.
  fix: Restore on the same or a newer SQL Server version, or upgrade this instance.
- code: "SQL 3154"
  source: SQL Server
  pattern: 'backup set holds a backup of a database other than|(?:error|msg)\D{0,12}3154\b'
  message: The backup set holds a backup of a database other than the existing database
  cause: The restore targets an existing database with a different origin.
  fix: Restore to a new database name, or restore with the replace option after confirming the target can be overwritten.
- code: "SQL 3101"
  source: SQL Server
  pattern: 'exclusive access could not be obtained|(?:error|msg)\D{0,12}3101\b'
  message: Exclusive access could not be obtained because the database is in use
  cause: Users or services are still connected to the database being restored.
  fix: Ask all users to log out of AutoCount, close other tools connected to the database, then restore again.
- code: "SQL 3201"
  source: SQL Server
  pattern: 'cannot open backup device|(?:error|msg)\D{0,12}3201\b'
  message: Cannot open backup device (operating system error 5 access denied, or 3 path not found)
  cause: The SQL Server service account cannot read or write that folder, or the path does not exist on the server machine.
  fix: Use a folder on the SQL Server machine that its service account can access, such as the instance's Backup folder.
- code: "SQL 5123"
  source: SQL Server
  pattern: 'create file encountered operating system error|(?:error|msg)\D{0,12}51(?:23|33)\b|directory lookup for the file'
  message: CREATE FILE or directory lookup failed with an operating system error
  cause: The restore tries to place the data files in a folder that does not exist or that SQL Server cannot write to.
  fix: Restore the files to the instance's data folder (relocate the files in the restore options).
- code: "SQL 2627"
  source: SQL Server
  pattern: 'violation of (primary key|unique key) constraint|cannot insert duplicate key'
  message: Violation of PRIMARY KEY or UNIQUE constraint (duplicate key)
  cause: A record with the same key already exists, for example a duplicate document number.
  fix: Check the document number or code named in the message. Do not delete rows directly; correct it in AutoCount.
- code: "SQL 547"
  source: SQL Server
  pattern: 'conflicted with the (foreign key|reference) constraint'
  message: The statement conflicted with a FOREIGN KEY or REFERENCE constraint
  cause: A record is still used by other records (for example deleting an item that has transactions), or it refers to a missing master record.
  fix: Find the related records named in the message and handle them in AutoCount first.
- code: "SQL 8152"
  source: SQL Server
  pattern: 'string or binary data would be truncated'
  message: String or binary data would be truncated
  cause: A value is longer than the field allows, often from an import or a plugin.
  fix: Shorten the value named in the message, or check the import file's column lengths.
- code: "SQL 926"
  source: SQL Server
  pattern: 'marked suspect|(?:error|msg)\D{0,12}926\b'
  message: Database cannot be opened. It has been marked SUSPECT by recovery
  cause: SQL Server could not recover the database after a crash, disk problem or missing file.
  fix: Stop. Do not detach or repair. Keep the files, check the disk, and restore the latest good backup with a senior engineer.
- code: "SQL 823/824"
  source: SQL Server
  pattern: 'logical consistency-based i/o error|operating system returned error .{0,60}during a (read|write)'
  message: I/O error or logical consistency error reading the database
  cause: Disk or storage problem; the database may be corrupted.
  fix: Stop. Take a copy of the files, check the disk, and plan a restore from the latest good backup with a senior engineer.
- code: "HTTP 400"
  source: e-Invoice (MyInvois)
  pattern: '\b400\b.{0,30}bad ?(request|structure)|badstructure'
  message: Bad Request
  cause: The submitted document structure or a field value is not accepted.
  fix: Read the rejection details for the field named, correct the document or master data, and resubmit.
- code: "HTTP 401"
  source: e-Invoice (MyInvois)
  pattern: '\b401\b.{0,30}unauthori|invalid_client'
  message: Unauthorized
  cause: Client ID / client secret invalid or expired, or credentials registered for a different environment (sandbox vs production).
  fix: Re-generate or re-enter the ERP client credentials from the MyInvois portal for the correct environment.
- code: "HTTP 403"
  source: e-Invoice (MyInvois)
  pattern: '\b403\b.{0,30}forbidden|incorrectsubmitter'
  message: Forbidden
  cause: The credentials are valid but not allowed to submit for this taxpayer (for example the intermediary is not authorised).
  fix: Check on the MyInvois portal that the ERP system or intermediary is linked to this taxpayer with submit permission.
- code: "HTTP 422"
  source: e-Invoice (MyInvois)
  pattern: '\b422\b|duplicate ?submission'
  message: Duplicate submission
  cause: The same documents were submitted again within a short time.
  fix: Wait for the first submission's result before resubmitting.
- code: "HTTP 429"
  source: e-Invoice (MyInvois)
  pattern: '\b429\b.{0,30}too many|too many requests'
  message: Too Many Requests
  cause: Submission rate limit reached.
  fix: Wait and resubmit in smaller batches.
