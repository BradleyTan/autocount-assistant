id: db_version_mismatch
title: Database version does not match the system version
keywords: [database version, db version, version mismatch, mismatch, not compatible, incompatible, newer version, older version, version]
ask_customer:
  - Which PC shows the message, and do other PCs open the same account book without it?
  - Was AutoCount upgraded recently on any PC, or was a backup restored?
checks:
  - id: db_older
    type: version_mismatch
    direction: db_older
    describe: Database is older than this system version expects
  - id: db_newer
    type: version_mismatch
    direction: db_newer
    describe: Database is newer than this system version expects
  - id: core_dlls
    type: core_dll_mismatch
    describe: All AutoCount DLLs match the system version
  - id: version_log
    type: log
    describe: Version mismatch messages in logs
    pattern: '(database|db) ?version.*(not match|mismatch|higher|lower|newer|older|incompatible|not support)'
causes:
  - id: upgrade_database
    title: The database is older than the system; it needs the database upgrade
    why: Each system version expects one database version. A newer program adds tables and fields, so it refuses to work on an older database until the upgrade adds them.
    checks: [db_older, version_log]
    requires: [db_older]
    base: 0.55
    menu: AutoCount login > database upgrade prompt (as an administrator)
    safety: The database upgrade cannot be undone except by restoring a backup. Take a full backup and get everyone out of AutoCount first.
    steps:
      - Back up the account book.
      - Make sure everyone is out of AutoCount.
      - Log in as an administrator with the upgraded system and run the database upgrade when prompted.
      - Upgrade AutoCount on every other PC that uses this account book to the same version.
    verify:
      - Run `autocount-assist scan` again; compatibility should show OK.
      - A normal user can log in and open a document.
  - id: upgrade_this_pc
    title: The database was upgraded from another PC; this PC runs an older system version
    why: Someone opened the account book with a newer AutoCount and upgraded the database. Older programs cannot read the newer structure, and a database cannot be downgraded.
    checks: [db_newer, version_log]
    requires: [db_newer]
    base: 0.55
    menu: Run the newer AutoCount installer on this PC
    changes_data: false
    safety: Do not try to downgrade the database. Upgrading the program on this PC does not change customer data.
    steps:
      - Check the system version on every PC that uses this account book.
      - Upgrade this PC to the same version as the one that upgraded the database.
      - Restore a backup only if the customer decides the upgrade must be undone.
    verify:
      - Run `autocount-assist scan` again; compatibility should show OK.
  - id: mixed_dlls
    title: Mixed AutoCount DLL versions make the system report the wrong version
    why: An interrupted or partial installation leaves some program files at the old version, so parts of the program disagree about which database version they expect.
    checks: [core_dlls]
    base: 0.45
    menu: Windows Settings > Apps > AutoCount Accounting > Modify/Repair
    changes_data: false
    steps:
      - Close AutoCount on this PC.
      - Rerun or repair the installer as administrator so every AutoCount DLL is the same version.
    verify:
      - Run `autocount-assist scan`; "AutoCount DLL version mismatches" should be none.
