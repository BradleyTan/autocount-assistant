id: einvoice_submission_fails
title: e-Invoice submission fails (MyInvois)
keywords: [e-invoice, einvoice, e invoice, myinvois, lhdn, irbm, submission, submit, validation, uin, tin]
ask_customer:
  - Does it fail for every document or only some? Since when?
  - What is the exact rejection message shown for one document?
  - Did anything change recently, such as a new client secret, a new PC or a new internet line?
checks:
  - id: auth_error
    type: log
    describe: e-Invoice authentication errors in logs
    pattern: '(\b401\b|unauthori[sz]ed|invalid_client|invalid client|token.*(expired|invalid))'
    context: 2
  - id: auth_reported
    type: question
    describe: Customer reports an authentication error
    pattern: '(\b401\b|unauthori[sz]ed|invalid.client|token (expired|invalid))'
  - id: tin_error
    type: log
    describe: TIN / buyer identity validation errors in logs
    pattern: '(invalid tin|tin.*(not match|invalid|not found|mismatch)|buyer.*tin|taxpayer.*not found)'
  - id: tin_reported
    type: question
    describe: Customer reports a TIN error
    pattern: '(invalid tin|tin (is )?(not match|invalid|not found|mismatch|wrong)|wrong tin)'
  - id: network_error
    type: log
    describe: Connectivity / TLS errors when calling MyInvois
    pattern: '(timed? ?out|unable to connect|no such host|name resolution|ssl|tls|could not establish trust|proxy)'
  - id: rate_limit
    type: log
    describe: Rate-limit responses from MyInvois
    pattern: '(\b429\b|too many requests|rate limit)'
  - id: doc_validation
    type: log
    describe: Document structure / validation errors returned by MyInvois
    pattern: '(validation (error|failed)|schema validation|invalid (structure|document)|rejected|CF\d{3})'
    context: 2
  - id: sandbox_env
    type: config
    describe: e-Invoice pointing at the sandbox / pre-production environment
    key: '(e-?invoice|myinvois|lhdn).*(env|environment|url|endpoint|server)'
    value: '(sandbox|preprod|pre-prod|uat|test)'
  - id: debtors_missing_tin
    type: sql
    verified: false
    describe: Active debtors with no TIN recorded
    finding_when: nonzero:n
    variants:
      - objects:
          debtor: {table: Debtor, columns: {active: IsActive, entity: TaxEntityID}}
          entity: {table: TaxEntity, columns: {id: TaxEntityID, tin: [TIN, TaxPayerTIN]}}
        query: >
          SELECT COUNT(*) AS n FROM {debtor} d LEFT JOIN {entity} e ON e.{entity.id} = d.{debtor.entity}
          WHERE d.{debtor.active} = 'T' AND (e.{entity.tin} IS NULL OR LTRIM(RTRIM(e.{entity.tin})) = '')
        ref: Debtor > TaxEntity.TIN
      - objects:
          debtor: {table: Debtor, columns: {active: IsActive, tin: [TIN, TaxPayerTIN]}}
        query: >
          SELECT COUNT(*) AS n FROM {debtor}
          WHERE {debtor.active} = 'T' AND ({debtor.tin} IS NULL OR LTRIM(RTRIM({debtor.tin})) = '')
        ref: Debtor.TIN
causes:
  - id: invalid_credentials
    title: e-Invoice client ID / secret invalid or expired
    why: AutoCount must first get an access token from MyInvois using the client ID and secret. If that fails, nothing is submitted, so every document fails the same way.
    checks: [auth_error, auth_reported]
    base: 0.5
    menu: Tools > Options > e-Invoice (client ID / client secret)
    safety: This changes a setting, not accounting data. Note the old client ID before replacing it.
    steps:
      - Log in to the MyInvois portal as the taxpayer and check the ERP system registration is active.
      - Generate a new client secret if the old one expired, for the same environment AutoCount uses.
      - Enter the client ID and secret again in AutoCount's e-Invoice settings and save.
      - Use the connection test, then resubmit one document before resubmitting the batch.
    verify:
      - One resubmitted document gets a validated status and a UIN from MyInvois.
      - No new 401 lines appear in the e-Invoice log (`autocount-assist logs 401 --since 1h`).
  - id: wrong_environment
    title: AutoCount is submitting to the sandbox instead of production (or credentials are for the other one)
    why: Sandbox and production are separate systems with separate credentials. Credentials from one are rejected by the other.
    checks: [sandbox_env, auth_error]
    requires: [sandbox_env]
    base: 0.4
    menu: Tools > Options > e-Invoice (environment)
    safety: Confirm with the customer that they are live before switching to production; production submissions are real tax documents.
    steps:
      - Confirm with the customer whether they are live on MyInvois production.
      - Switch the e-Invoice environment to Production and enter the production client ID and secret.
      - Resubmit one document to confirm.
    verify:
      - The document appears in the customer's production MyInvois portal.
  - id: buyer_tin_invalid
    title: Buyer TIN missing or invalid on the debtor
    why: MyInvois checks the buyer's TIN against its ID number (BRN, NRIC or passport). If they do not belong together, only that buyer's documents are rejected.
    checks: [tin_error, tin_reported, debtors_missing_tin]
    base: 0.45
    menu: A/R > Debtor Maintenance > (debtor) > e-Invoice / Tax tab
    safety: This changes debtor master data. Get the correct TIN from the buyer in writing; do not guess it.
    steps:
      - Open the debtor named on the rejected invoice.
      - Validate the buyer's TIN and ID (BRN/NRIC) on the MyInvois portal's TIN search.
      - Correct the TIN / ID type on the debtor, save, then resubmit the invoice.
      - For buyers without a TIN, use the general public TIN as allowed by LHDN guidelines.
    verify:
      - The rejected invoice is accepted when resubmitted.
  - id: network_blocked
    title: Network, proxy or TLS problem reaching MyInvois
    why: Submission is a web call from this PC to LHDN. If the PC cannot reach the host, nothing arrives, whatever the document contains.
    checks: [network_error]
    base: 0.45
    menu: Windows network / firewall settings (outside AutoCount)
    changes_data: false
    steps:
      - From the same PC, open the MyInvois API host in a browser to confirm it is reachable.
      - Check the firewall / antivirus web filter and any proxy allows the MyInvois hosts on port 443.
      - Make sure Windows is up to date so TLS 1.2 is enabled, then retry.
    verify:
      - The connection test in AutoCount's e-Invoice settings succeeds.
  - id: rate_limited
    title: Submission rate limit reached
    why: MyInvois limits how many requests a system may send per minute. Extra requests are refused until the limit resets.
    checks: [rate_limit]
    base: 0.5
    menu: e-Invoice submission screen
    changes_data: false
    steps:
      - Wait a few minutes, then resubmit.
      - Submit large batches in smaller groups.
    verify:
      - The remaining documents are accepted on the next attempt.
  - id: document_invalid
    title: Document data fails MyInvois validation (classification, tax type, address, etc.)
    why: MyInvois validates each document's fields. One wrong field rejects that document only, while others go through.
    checks: [doc_validation]
    base: 0.45
    menu: The source document (e.g. Sales > Invoice) > e-Invoice details
    safety: Correct master data rather than editing posted documents where possible. A validated e-Invoice can only be changed by a credit or debit note.
    steps:
      - Open the rejection details for the document to read the field MyInvois rejected.
      - Correct that field on the document or its master data (item classification, tax type, state code, address).
      - Resubmit the document.
    verify:
      - The document status changes to validated.
