id: stock_balance_mismatch
title: Stock balance does not match (stock card vs balance report vs physical)
keywords: [stock, balance, qty, quantity, inventory, stock card, mismatch, negative stock, costing, uom]
ask_customer:
  - Which item, location and date show the difference, and what are the two quantities?
  - Which two reports (or report and physical count) are being compared?
  - Were any documents back-dated, edited or deleted recently?
checks:
  - id: negative_balance
    type: sql
    verified: false
    describe: Items with a negative balance by location
    objects:
      stock: {table: StockDTL, columns: {item: ItemCode, loc: Location, qty: Qty}}
    query: >
      SELECT TOP 20 {stock.item} AS ItemCode, {stock.loc} AS Location, SUM({stock.qty}) AS Balance FROM {stock}
      GROUP BY {stock.item}, {stock.loc} HAVING SUM({stock.qty}) < 0 ORDER BY SUM({stock.qty})
    ref: StockDTL (SUM(Qty) by ItemCode, Location)
  - id: bad_uom_rate
    type: sql
    verified: false
    describe: Item UOMs with zero or missing conversion rate
    objects:
      uom: {table: ItemUOM, columns: {item: ItemCode, uom: UOM, rate: Rate}}
    query: >
      SELECT TOP 20 {uom.item} AS ItemCode, {uom.uom} AS UOM, {uom.rate} AS Rate FROM {uom}
      WHERE {uom.rate} IS NULL OR {uom.rate} <= 0
    ref: ItemUOM.Rate
  - id: future_dated
    type: sql
    verified: false
    describe: Stock transactions dated in the future
    objects:
      stock: {table: StockDTL, columns: {date: DocDate}}
    query: SELECT COUNT(*) AS n, MAX({stock.date}) AS latest FROM {stock} WHERE {stock.date} > GETDATE()
    finding_when: nonzero:n
    ref: StockDTL.DocDate
  - id: costing_error
    type: log
    describe: Stock costing / recalculation errors in logs
    pattern: '(costing|recalculat|stock (status|balance)).*(error|fail|exception|timeout)'
    context: 2
causes:
  - id: negative_stock
    title: Stock went negative (issued before it was received, or a missing receipt)
    why: Balance is receipts minus issues. If a sale is posted before its purchase or goods received note, the running balance drops below zero at that date. Reports that read the balance at different dates then disagree, and costing has no cost for the negative part.
    checks: [negative_balance]
    base: 0.5
    menu: Stock > Stock Card (per item / location)
    safety: Posting or re-dating documents changes stock value and may change cost of sales in closed periods. Agree the correction with the customer's accountant first.
    steps:
      - Open the stock card for each item listed and find where the running balance first goes negative.
      - Check for a missing or wrongly dated goods received / purchase invoice before that point.
      - Post the missing receipt or correct the document date, then run the stock costing recalculation.
      - If negative stock should not happen, review the "allow negative stock" setting with the customer.
    verify:
      - The stock card's running balance no longer goes below zero for those items.
      - '`autocount-assist ask` on the same question no longer lists them as negative.'
  - id: uom_rate
    title: Wrong UOM conversion rate distorts quantities
    why: Quantities in other units are converted to the base unit by the rate. A zero or wrong rate converts every transaction in that unit to the wrong base quantity.
    checks: [bad_uom_rate]
    base: 0.5
    menu: Stock > Item Maintenance > (item) > UOM
    safety: Changing a UOM rate affects every past transaction in that unit when costing is recalculated. Confirm the correct rate with the customer.
    steps:
      - Open each item listed and correct the UOM rate (the base UOM must be 1).
      - Run the stock costing recalculation so balances are rebuilt with the right rate.
    verify:
      - The item's balance in base units equals the manual calculation for a few sample transactions.
  - id: future_dates
    title: Future-dated documents make "as at today" balances differ from the stock card
    why: A report "as at today" leaves out documents dated after today, while a report with no date limit includes them.
    checks: [future_dated]
    base: 0.45
    menu: Stock > Stock Card (filter by date range)
    safety: Confirm with the customer that the dates are typing mistakes before changing them.
    steps:
      - List the documents with a date after today and confirm whether the dates are typos.
      - Correct the document dates, then compare the reports again using the same "as at" date.
    verify:
      - Both reports show the same quantity for the same "as at" date.
  - id: costing_not_recalculated
    title: Stock costing recalculation failed or has not been run after back-dated changes
    why: Back-dated documents change the order of receipts and issues. Until costing is recalculated, stored balances and costs still reflect the old order.
    checks: [costing_error]
    base: 0.45
    menu: Tools > Recalculate Stock Costing
    safety: Recalculation rewrites cost figures and can take a long time. Back up first and run it when no one is using AutoCount.
    steps:
      - Ask all users to log out, back up the account book, then run the stock costing recalculation.
      - If it fails again, note the item in the error and check that item's transactions for bad data.
    verify:
      - The recalculation finishes without an error and the two reports agree.
  - id: report_filters
    title: The two reports use different date, location or item filters
    why: Two reports only agree when they cover the same items, locations and dates.
    checks: []
    base: 0.3
    menu: The report's filter / criteria screen
    changes_data: false
    steps:
      - Re-run both reports with the same date, location, item group and "include inactive" options.
    verify:
      - The quantities match once the filters are the same.
